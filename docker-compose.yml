# Issho home server. First run:
#   cp server/.env.example server/.env        # then set HOUSEHOLD_CODE (and TZ, ANTHROPIC_API_KEY)
#   mkdir -p issho-data                        # on Linux it must be writable by uid 1000:
#   sudo chown 1000:1000 issho-data            #   (skip if your user already is uid 1000)
#   docker compose up -d --build
# Members, devices and the household name, also while it runs:
#   docker compose exec issho node server/src/admin.ts list      (or: help)
#
# Voice: the app ships pre-recorded VOICEVOX clips for its course. The optional `voicevox` service
# below reads everything else aloud (chat lines, AI replies, rarer words) in the same voices. It is
# a large image (about 2 GB) and uses CPU only while it speaks. Without it the app uses the
# phone's own Japanese voice for those. To leave it out: `docker compose up -d --build issho`.
#
# HTTPS is needed on the phones: on a plain http://192.168.x.x:8787 address the browser won't let
# Issho work offline or record voice (only https:// and localhost may). Easiest: Tailscale on this
# machine and both phones, then `tailscale serve --bg 8787` and open https://<machine>.<tailnet>.ts.net.
# Or put Caddy in front with your own domain. Details in server/.env.example ("HTTPS").
services:
  issho:
    build: .
    image: issho:latest
    restart: unless-stopped
    env_file: server/.env
    # Paths inside the container. These win over server/.env, so a .env written for
    # `npm start` (DATA_DIR=./data, …) can't point the server away from the volume.
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      STATIC_DIR: /app/dist
      # The speech engine below, on Docker's internal network. While it is down or still warming
      # up, /api/health says ttsEnabled: false and the phones use their own voice.
      VOICEVOX_URL: http://voicevox:50021
    # Behind Tailscale serve or a proxy on this machine, "127.0.0.1:8787:8787" keeps the plain
    # http port off the network.
    ports:
      - "8787:8787"
    volumes:
      - ./issho-data:/data

  # Optional speech engine (VOICEVOX, CPU build). No depends_on: Issho works without it.
  voicevox:
    # The engine version the app's voice clips were made with ("engine" in public/audio/manifest.json),
    # so what the server reads sounds like the clips. After `npm run build:audio` with a newer engine,
    # change this tag to match.
    image: voicevox/voicevox_engine:cpu-0.25.2
    restart: unless-stopped
    # Internal: issho reaches it at http://voicevox:50021. Not published to the network.
    expose: ["50021"]
    # For `docker compose ps`. Loading the voices takes a while on a slow CPU.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:50021/version"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
